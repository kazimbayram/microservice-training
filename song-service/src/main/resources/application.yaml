server:
  port: 8082

spring:
  application:
    name: song-service
  datasource:
    url: ${SONG_DB_URL:jdbc:postgresql://localhost:5434/song_db}
    username: ${SONG_DB_USERNAME:song_db_username}
    password: ${SONG_DB_PASSWORD:song_db_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
