server:
  port: 8082

spring:
  application:
    name: song-service
  datasource:
    url: ${SONG_DB_URL:jdbc:postgresql://localhost:5434/song_db}
    username: ${SONG_DB_USERNAME:song_db_username}
    password: ${SONG_DB_PASSWORD:song_db_password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.hostname}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
