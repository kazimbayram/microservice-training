services:
  kb-resource-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resource_db
      POSTGRES_USER: ${RESOURCE_DB_USERNAME:-resource_db_username}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:-resource_db_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - resource-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  kb-song-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: song_db
      POSTGRES_USER: ${SONG_DB_USERNAME:-song_db_username}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD:-song_db_password}
    ports:
      - "${SONG_DB_PORT:-5434}:5432"
    volumes:
      - song-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resource-db-data:
  song-db-data:
