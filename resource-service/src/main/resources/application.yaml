server:
  port: 8081

song-service:
  base-url: ${SONG_SERVICE_URL:http://localhost:8082}

spring:
  application:
    name: resource-service
  datasource:
    url: ${RESOURCE_DB_URL:jdbc:postgresql://localhost:5433/resource_db}
    username: ${RESOURCE_DB_USERNAME:resource_db_username}
    password: ${RESOURCE_DB_PASSWORD:resource_db_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
